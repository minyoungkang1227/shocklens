# 팩터 7개 = 지경학 충격이 자산으로 전달되는 경로
# kind:
#   level      -> 수준값의 일별 차분 (예: VIX 20 -> 22 이면 +2)
#   price      -> 로그수익률
#   spread_ret -> 두 ETF 로그수익률의 차이

factors:
  risk_off:
    label: 위험회피 (VIX)
    source: fred
    series: VIXCLS
    kind: level
  dollar:
    label: 달러 인덱스 (Broad)
    source: fred
    series: DTWEXBGS
    kind: price
  cny:
    label: 위안화 (USD/CNY)
    source: fred
    series: DEXCHUS
    kind: price
  oil:
    label: 유가 (WTI)
    source: fred
    series: DCOILWTICO
    kind: price
  ust10y:
    label: 미 10년물 금리
    source: fred
    series: DGS10
    kind: level
  hy_spread:
    label: 하이일드 스프레드
    source: fred
    series: BAMLH0A0HYM2
    kind: level
  tech_war:
    label: 기술전쟁 (반도체 - 미국 주식)
    source: etf
    long: SOXX
    short: SPY
    kind: spread_ret

# 뉴스 기반 지수: 팩터가 아니라 강도 보정과 유사 사건 탐색에만 쓴다.
# 자동 다운로드 경로가 바뀔 수 있어 수동으로 받아 data/raw/indices/ 에 둔다.
#   GPR: https://www.matteoiacoviello.com/gpr.htm
#   TPU: https://www.matteoiacoviello.com/tpu.htm
news_indices:
  gpr: {file: data/raw/indices/gpr_daily.csv}
  tpu: {file: data/raw/indices/tpu_daily.csv}
