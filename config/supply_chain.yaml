# 공급망 의존도 표 (Exposure Analyst 보강). 사건이 조건에 맞으면 해당 바스켓 노출을 끌어올리고 근거를 남긴다.
# 조건: instruments(수단 목록, 비우면 무관) AND (sectors_any 또는 countries_any 중 하나라도 겹침)
# 등급과 근거는 공개 자료 기반의 정성 판단(초안). 실제 보유 종목이 있으면 기업별 매출·공급처 국가로 대체한다.

links:
