# 사람이 고른 정책 사건 후보 (아침 브리핑 2026-11-12 ~ 11-25 기준). 정리일: 2026-11-25.
#
# 아직 events.yaml에 넣지 않는다.
# - 2026-11-23 방향 문서 기준, 실전 성적표가 30건 쌓이기 전에는 엔진 숫자를 바꾸지 않는다.
# - events.yaml이 바뀌면 유사 사건 결과가 바뀌고 kfin-eval CI가 깨진다. 편입할 때는 collatio 정답지도 같이 갱신한다.
# - 이 파일은 pipeline/library_builder.py가 덮어쓰는 candidates.yaml과 다른 파일이다(그 파일은 fetch 때마다 새로 쓰인다).
#
# 어휘는 agents/state.py에 맞췄다(INSTRUMENTS, SECTORS, STAGES).
# 채널 부호는 기존 사건과 맞췄다.
#   - tech_war = SOXX - SPY. 미국 대중 수출통제 확대면 반도체가 상대적으로 약하므로 -1.
#   - cny = USD/CNY. 위안 약세면 +1.
# 강도 6요소(severity_components)는 비워 둔다. 사후 채점 편향을 막으려고 relabel_severity(블라인드)로 채운다.
# 날짜·시각에 '확인 필요'가 붙은 항목은 편입 전에 원문으로 확인한다.

