# 지경학 사건 라이브러리 (손으로 정리, Git에 포함)
# 날짜는 발표일(현지 기준). 미국 시장 기준 첫 거래일부터 반응 구간을 잡는다(주말 발표는 다음 월요일부터).
# severity(강도)는 임시값이며, 사건이 15건 모이면 GPR·TPU와 실제 변동으로 다시 맞춘다.
# instrument(수단): tariff, tariff_pause, tech_export_control, entity_list, resource_export_control,
#                   currency, financial_sanction
# direction: escalate(확대, 기본값) / ease(완화). 유사 사례는 방향이 같은 사건끼리만 쓴다.
# stage: announce, escalate, enforce, retaliate, ease
# channels: 이 사건이 움직였을 것으로 보는 팩터와 방향(+1 상승 / -1 하락). 충격은 이 팩터만 쓴다.
#           credit = HYG-IEF 이므로 신용 경색은 -1.
# confounders: 같은 기간에 겹친 다른 큰 사건. 분석할 때 해석을 조심해야 한다.
# clean: 반응 창(발표 후 3거래일) 안에 이 사건과 무관한 큰 충격이 없으면 true.
#        false인 사건은 유사 사례(충격 크기 산정)에서 빼고, 검증 결과도 따로 해석한다.
#        같은 분쟁의 맞대응(예: 미국 통제 직후 중국 보복)은 같은 에피소드로 보고 clean으로 둔다.
# 반응 창이 서로 겹치는 사건은 한 건만 넣는다(예: 2024-12-02 미국 반도체 통제는 cn_ban_us_2024에 포함).

